name: hermes-time-awareness
version: "2.0.1"
description: >
  A sense of time for Hermes agents, without timestamping every message. Three
  dimensions in one injected block: the clock (system only, every turn), the gap
  since the last completed exchange (state.db, index-keyed by session, cached),
  and the session's elapsed-versus-active time (pauses above a threshold are not
  counted as work). Cross-session gaps use a dedicated one-row-per-session table
  instead of scanning the message table. Injected into the user turn, never the
  system prompt, so the prompt cache stays byte-stable. Writes no message
  content.
provides_hooks:
  - pre_llm_call
